{% extends "base.html" %}
{% block title %}Error · PixelScope{% endblock %}

{% block content %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;padding:40px 20px;">
  <div style="font-size:4rem;margin-bottom:20px;">⚠️</div>
  <h1 style="font-size:1.4rem;font-weight:700;margin-bottom:10px;">Something went wrong</h1>
  <p style="color:var(--muted);margin-bottom:30px;max-width:380px;">{{ message }}</p>
  <a href="/" class="btn btn-primary">← Back to Home</a>
</div>
{% endblock %}
